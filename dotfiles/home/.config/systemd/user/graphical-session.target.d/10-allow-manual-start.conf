[Unit]
# RefuseManualStart=yes 是 systemd 给 graphical-session.target 的保护:
# 只允许会话管理器(uwsm 等)以"依赖"方式把它拉起来。
# 本机 ly 的 session 是 /usr/bin/start-hyprland(非 uwsm), 没人以依赖方式拉它 ⇒
# waybar/hypridle/hyprpolkitagent/udisks-automount 全都不启动(waybar.service 带
# Requisite=graphical-session.target, 手动 start 会被拒)。
# 这里放开手动启动, 由 hyprland.lua 的 hyprland.start 钩子调用一次。
RefuseManualStart=no
