# ============================================================
#  kitty 配置 — 中文显示优化 + 鲜亮高对比主题
#  生成: 2026-09-14 ｜ kitty 0.48.2
#  重载: kill -SIGUSR1 $(pgrep -x kitty)  或  Ctrl+Shift+F5
# ============================================================

# ---------- 字体:中英混排 ----------
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# 中文/假名/全角符号 → 思源黑体(Noto Sans CJK SC),字形统一清晰
symbol_map U+2E80-U+2EFF,U+3000-U+303F,U+3040-U+30FF,U+31C0-U+31EF,U+3400-U+4DBF,U+4E00-U+9FFF,U+F900-U+FAFF,U+FE10-U+FE4F,U+FF00-U+FFEF Noto Sans CJK SC
# Emoji → 彩色字体
symbol_map U+1F000-U+1FAFF,U+2600-U+27BF Noto Color Emoji

# 行高略微加大:中文上下不挤
modify_font cell_height 110%
# 波浪下划线更醒目
undercurl_style thick-dense

# ---------- 鲜亮高对比配色 ----------
foreground            #eaf0ff
background            #0a0c14
selection_foreground  #0a0c14
selection_background  #7aa2ff
cursor                #ffffff
cursor_text_color     #0a0c14
url_color             #64d2ff

color0  #161a26
color8  #4a5169
color1  #ff5f6d
color9  #ff8a95
color2  #3ddc84
color10 #7cf0a8
color3  #ffd166
color11 #ffe599
color4  #5aa9ff
color12 #8cc6ff
color5  #c792ea
color13 #e0b0ff
color6  #4dd0e1
color14 #8ff0ff
color7  #c9d1e3
color15 #ffffff

# 保证低对比前景色也能看清(WCAG AA 4.5:1,ratio 模式对图形字符更安全)
text_fg_override_threshold 4.5 ratio

# ---------- 窗口与光标 ----------
window_padding_width    8
background_opacity      1.0
dim_opacity             0.6
cursor_shape            block
cursor_trail            2
cursor_beam_thickness   1.5
confirm_os_window_close 0
scrollback_lines        10000
enable_audio_bell       no

# ---------- 标签栏(鲜亮 powerline) ----------
tab_bar_style           powerline
tab_powerline_style     slanted
active_tab_foreground   #0a0c14
active_tab_background   #7aa2ff
inactive_tab_foreground #c9d1e3
inactive_tab_background #1c2130
tab_bar_background      #0a0c14

# ---------- 活动窗口边框 ----------
active_border_color   #7aa2ff
inactive_border_color #2a2f45
