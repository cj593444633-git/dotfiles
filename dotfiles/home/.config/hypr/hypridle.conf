# hypridle 配置 —— 2026-09-15 补建
# 背景: hyprland.lua 第 13 行声明 "hypridle 由 systemd user 服务托管(hypridle.service)",
#       但 ~/.config/hypr/ 下一直没有 hypridle.conf, hypridle 启动 46ms 即退出,
#       systemd 触发 start-limit-hit → 自动锁屏/息屏其实一直没生效。
# 生效方式: systemctl --user reset-failed hypridle.service && systemctl --user restart hypridle.service
# 调参: 改下面的 timeout(秒)。想完全关掉: systemctl --user disable --now hypridle.service

general {
    # 锁屏命令(hypridle 收到会话锁定信号时执行)
    lock_cmd = pidof hyprlock || hyprlock
    # 进入睡眠前先锁屏
    before_sleep_cmd = loginctl lock-session
}

# 5 分钟无操作 → 锁屏
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}
